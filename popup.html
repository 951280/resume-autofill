<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>简历秒填</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 300px; padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px; color: #0f172a; background: #fff;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .logo { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
        background: linear-gradient(135deg,#1f3864,#2f5496); color: #fff; font-weight: 700; font-size: 12px; }
      .title { font-weight: 600; font-size: 14px; }
      .site { font-size: 11.5px; color: #64748b; margin-bottom: 10px; word-break: break-all; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .row span { color: #64748b; font-size: 12px; flex: none; }
      select { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid #cbd5e1;
        border-radius: 7px; font-size: 12px; background: #fff; color: #0f172a; outline: none; }
      select:focus { border-color: #2f5496; box-shadow: 0 0 0 3px rgba(47,84,150,.12); }
      button.primary { width: 100%; height: 34px; border: 0; border-radius: 8px; cursor: pointer;
        background: linear-gradient(135deg,#1f3864,#2f5496); color: #fff; font-size: 13px; font-weight: 600; }
      button.primary:hover { filter: brightness(1.08); }
      button.primary:disabled { opacity: .55; cursor: not-allowed; }
      .hint { margin-top: 8px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
      .msg { margin-top: 8px; font-size: 11.5px; color: #b91c1c; display: none; }
      footer { display: flex; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #eef2f7; }
      footer a { color: #2f5496; font-size: 12px; text-decoration: none; cursor: pointer; }
      footer a:hover { text-decoration: underline; }
      .badge { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: #f1f5f9; color: #64748b; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">简</div>
      <div class="title">简历秒填</div>
      <span class="badge">本地</span>
    </header>

    <div class="site" id="site">当前页面：—</div>

    <div class="row">
      <span>简历</span>
      <select id="profile"></select>
    </div>

    <button class="primary" id="open">打开填写面板</button>
    <div class="hint">快捷键 Alt + Shift + F · 只填不提交，填完请核对</div>
    <div class="msg" id="msg"></div>

    <footer>
      <a id="edit">编辑简历</a>
      <a id="settings">设置</a>
    </footer>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
